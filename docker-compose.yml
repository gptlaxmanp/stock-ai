services:

  backend:
    build:
      context: ./backend
    container_name: stock-ai-backend
    ports:
      - "8080:8080"
    environment:
      PYTHON_MARKET_URL: http://python-market:8001
    depends_on:
      - python-market

  python-market:
    build:
      context: ./python-market
    container_name: stock-ai-python-market
    ports:
      - "8001:8001"